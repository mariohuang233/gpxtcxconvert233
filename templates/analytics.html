<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>访问统计 · GPX → TCX</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/style.css"><script src="/static/theme.js"></script><script src="/static/analytics.js" defer></script></head><body><main class="stats-container"><header class="stats-header"><h1>访问统计</h1><a href="/">返回转换工具</a></header><p class="field-help">统计保留 30 天，日期按 UTC 汇总；访问次数包括重复访问，独立访客为每日会话去重，最多 10,000 个。转换成功与失败由服务器记录，下载为请求次数。</p><form id="stats-form"><div class="form-group"><label for="admin-token">管理员令牌</label><input type="password" id="admin-token" autocomplete="off" required aria-describedby="token-help"><p id="token-help" class="field-help">使用部署时设置的 ADMIN_TOKEN。令牌仅保留在当前页面内存中。</p></div><button type="submit" class="btn btn-primary">查看统计</button></form><p id="stats-error" role="alert" class="field-error"></p><div id="stats-result" hidden><table><caption class="sr-only">最近 30 天聚合事件</caption><thead><tr><th scope="col">日期（UTC）</th><th scope="col">事件</th><th scope="col">次数</th></tr></thead><tbody id="stats-body"></tbody></table><button type="button" id="clear-stats" class="location-toggle">清空统计</button><p class="field-help">清空后不可恢复，不会删除轨迹任务。</p></div></main></body></html>
