name: Web checks and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run test:converter
      - run: npm run test:analytics
      - run: python tests/validate_pages_output.py
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility tests
        run: |
          python web_app.py > /tmp/gpx-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).close()
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise RuntimeError('Web server did not start')
          PY
          npm test
      - name: Build Pages
        env:
          PAGES_ANALYTICS_ENDPOINT: ${{ vars.PAGES_ANALYTICS_ENDPOINT }}
        run: npm run build:pages
      - name: Static Pages browser and schema checks
        env:
          TEST_BASE_URL: http://127.0.0.1:8900/gpxtcxconvert233
        run: |
          python tests/serve_pages.py > /tmp/gpx-pages.log 2>&1 &
          pages_pid=$!
          trap 'kill "$pages_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8900/gpxtcxconvert233/', timeout=1).close()
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise RuntimeError('Pages preview did not start')
          PY
          npm run test:pages
          python tests/validate_pages_output.py test-artifacts/pages
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
          include-hidden-files: true
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [python, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
